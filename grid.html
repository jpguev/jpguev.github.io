<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Photo Gallery | John Paolo Aala</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            color-scheme: dark;
            --gallery-bg: #071519;
            --gallery-card: #10282d;
            --gallery-accent: #4fc3f7;
            --gallery-text: #e5f7ff;
            --gallery-muted: #9bb9bf;
            --gallery-link: #a8dce8;
        }

        [data-theme="light"] {
            color-scheme: light;
            --gallery-bg: #eef5f4;
            --gallery-card: #ffffff;
            --gallery-accent: #008c9a;
            --gallery-text: #19363b;
            --gallery-muted: #52696d;
            --gallery-link: #007985;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            background: var(--gallery-bg);
            color: var(--gallery-text);
            font-family: 'Segoe UI', sans-serif;
        }

        .gallery-shell {
            max-width: 1440px;
            margin: 0 auto;
            padding: 28px clamp(16px, 3vw, 40px) 36px;
        }

        .gallery-topline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            margin-bottom: 22px;
        }

        .gallery-back {
            color: var(--gallery-link);
            text-decoration: none;
            font-size: 0.92rem;
        }

        .gallery-back:hover {
            color: var(--gallery-text);
        }

        .gallery-title {
            margin: 0 0 7px;
            font-size: clamp(1.75rem, 4vw, 2.6rem);
            font-weight: 650;
        }

        .gallery-intro {
            margin: 0;
            color: var(--gallery-muted);
            font-size: 0.95rem;
        }

        .gallery-rule {
            width: 58px;
            height: 3px;
            margin: 0 0 24px;
            background: var(--gallery-accent);
            border-radius: 2px;
        }

        .card {
            position: relative;
            background-color: var(--gallery-card);
            border: 1px solid rgba(79, 195, 247, 0.2);
            border-radius: 8px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: rgba(79, 195, 247, 0.62);
            box-shadow: 0 18px 38px rgba(0, 0, 0, 0.32);
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card::after {
            content: '';
            position: absolute;
            inset: 45% 0 0;
            background: linear-gradient(transparent, rgba(2, 13, 16, 0.55));
            pointer-events: none;
        }

        .bento-xxl {
            height: 28.5rem;
        }

        .bento-xl {
            height: 24rem;
        }

        .bento-lg {
            height: 22rem;
        }

        .bento-md {
            height: 12rem;
        }

        .bento-sm {
            height: 14rem;
        }

        @media (max-width: 991.98px) {
            .bento-xxl {
                height: 16rem;
            }

            .bento-xl {
                height: 14rem;
            }

            .bento-lg {
                height: 16rem;
            }

            .bento-md {
                height: 14rem;
            }

            .bento-sm {
                height: 14rem;
            }
        }

        @media (max-width: 575.98px) {
            .bento-xxl {
                height: 15rem;
            }

            .bento-xl {
                height: 13rem;
            }

            .bento-lg {
                height: 13rem;
            }

            .bento-md {
                height: 11rem;
            }

            .bento-sm {
                height: 11rem;
            }
        }
    </style>
</head>

<body>

    <div class="container-fluid p-3">
            <div class="gallery-shell">
                <header class="gallery-topline">
                    <div>
                        <h1 class="gallery-title">Photo Gallery</h1>
                        <p class="gallery-intro">Snapshots, projects, and moments worth keeping.</p>
                    </div>
                    <a class="gallery-back" href="index.html#home" target="_top"><i class="fas fa-arrow-left" aria-hidden="true"></i> Back to portfolio</a>
                </header>
                <div class="gallery-rule"></div>
                <div class="row g-2">
                <div class="col-12 col-lg-9">
                <div class="row g-2">

                    <div class="col-12 col-lg-4">
                        <div class="row g-2">
                            <div class="col-6 col-lg-12 p-1">
                                <div class="card p-1 bento-xl">
                                    <img src="pixx/Screenshot%20(26).png" class="img-fluid" alt="pixx">
                                </div>
                            </div>
                            <div class="col-6 col-lg-12 p-1">
                                <div class="card p-1 bento-md">
                                    <img src="pixx/Screenshot 2026-09-14 133857.png" class="img-fluid" alt="pixx">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-lg-8">
                        <div class="row g-2">
                            <div class="col-12 col-md-6 p-1">
                                <div class="card p-1 bento-sm">
                                    <img src="pixx/Screenshot 2026-06-16 174248.png" class="img-fluid" alt="pixx">
                                </div>
                            </div>
                            <div class="col-12 col-md-6 p-1">
                                <div class="card p-1 bento-sm">
                                    <img src="pac.jpg" alt="">
                                </div>
                            </div>
                            <div class="col-12 p-1">
                                <div class="card p-1 bento-lg">
                                    <img src="farm.jpg" class="img-fluid" alt="farm">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-md-7 col-lg-8 p-1">
                        <div class="card p-1 bento-sm">
                            <img src="pixx/mask.jpeg" class="img-fluid" alt="pixx">
                        </div>
                    </div>
                    <div class="col-12 col-md-5 col-lg-4 p-1">
                        <div class="card p-1 bento-sm">
                            <img src="pixx/piriswil.jpeg" class="img-fluid" alt="pixx">
                        </div>
                    </div>

                </div>
            </div>
            <div class="col-12 col-lg-3">
                <div class="row g-2">
                    <div class="col-12 col-md-6 col-lg-12 p-1">
                        <div class="card p-1 bento-xxl">
                            <img src="pixx/mua.jpeg" class="img-fluid" alt="pixx">
                        </div>
                    </div>
                    <div class="col-12 col-md-6 col-lg-12 p-1">
                        <div class="card p-1 bento-lg">
                            <img src="pixx/AALA_AFTER.jpg" class="img-fluid" alt="pixx">
                        </div>
                    </div>
                </div>
            </div>

        </div>
            </div>
        </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const notifyParent = () => {
            window.parent.postMessage({
                type: 'gallery-height',
                height: document.documentElement.scrollHeight
            }, '*');
        };

        new ResizeObserver(notifyParent).observe(document.documentElement);
        window.addEventListener('load', notifyParent);

        window.addEventListener('message', (event) => {
            if (event.source !== window.parent || !event.data || event.data.type !== 'gallery-theme') {
                return;
            }

            document.documentElement.dataset.theme = event.data.theme === 'light' ? 'light' : 'dark';
        });
    </script>
    
</body>

</html>
